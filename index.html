<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật 🎂</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at center, #17102d 0%, #07000f 45%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           NỀN ÁNH SÁNG
        ========================= */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle,
                rgba(255, 0, 200, 0.18),
                transparent 70%);
            animation: backgroundMove 8s infinite alternate ease-in-out;
        }

        @keyframes backgroundMove {
            0% {
                transform: translate(-250px, -150px) scale(1);
            }

            50% {
                transform: translate(250px, 150px) scale(1.3);
            }

            100% {
                transform: translate(-100px, 250px) scale(1);
            }
        }

        /* =========================
           KHUNG CHỮ
        ========================= */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: clamp(32px, 5vw, 60px);
            max-width: 1000px;
            line-height: 1.4;
            margin: 0;

            color: #fff;

            opacity: 0;

            animation:
                glow 1.5s infinite alternate,
                float 4s ease-in-out infinite,
                colorShift 6s infinite alternate,
                zoomIn 1.2s ease forwards;

            transition: opacity 1s ease;
        }

        /* Neon */
        @keyframes glow {
            from {
                text-shadow:
                    0 0 10px #00faff;
            }

            to {
                text-shadow:
                    0 0 10px #00ffff,
                    0 0 25px #00e5ff,
                    0 0 45px #ff00ff,
                    0 0 70px #ff00ff;
            }
        }

        /* Trôi */
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-18px);
            }
        }

        /* Đổi màu */
        @keyframes colorShift {
            0% {
                color: #00faff;
            }

            25% {
                color: #ffffff;
            }

            50% {
                color: #ff66ff;
            }

            75% {
                color: #ffd700;
            }

            100% {
                color: #00ffcc;
            }
        }

        /* Zoom */
        @keyframes zoomIn {
            from {
                transform: scale(0.5);
            }

            to {
                transform: scale(1);
            }
        }

        /* =========================
           TRÁI TIM BAY
        ========================= */
        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: heartFly linear forwards;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes heartFly {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    translateX(var(--move))
                    scale(1.5)
                    rotate(360deg);

                opacity: 0;
            }
        }

        /* =========================
           SAO LẤP LÁNH
        ========================= */
        .star {
            position: absolute;
            color: white;
            font-size: 12px;
            animation: twinkle 2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.5);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
                text-shadow:
                    0 0 10px white,
                    0 0 20px #00ffff;
            }
        }

        /* =========================
           PHÁO HOA
        ========================= */
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: white;
            box-shadow:
                0 0 10px white,
                0 0 20px #00ffff;
            animation: explode 1.2s ease-out forwards;
            z-index: 3;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(25);
                opacity: 0;
            }
        }

        /* =========================
           BÓNG BAY
        ========================= */
        .balloon {
            position: absolute;
            bottom: -100px;
            font-size: 45px;
            animation: balloonFly 10s linear infinite;
            opacity: 0.8;
        }

        @keyframes balloonFly {
            0% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-55vh) rotate(5deg);
            }

            100% {
                transform: translateY(-120vh) rotate(-5deg);
            }
        }

        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 id="text"></h1>
    </div>

    <script>

        /* =========================
           NỘI DUNG
        ========================= */

        const messages = [
            "🎂✨ CHÚC MỪNG SINH NHẬT ✨🎂",
            "🎉 Chúc bạn có một ngày sinh nhật thật vui vẻ! 🎉",
            "💖 Chúc bạn luôn hạnh phúc và bình an 💖",
            "🌟 Chúc tuổi mới thật nhiều may mắn! 🌟",
            "🎁 Chúc mọi điều ước của bạn đều trở thành hiện thực! 🎁",
            "🥳 HAPPY BIRTHDAY TO YOU 🥳",
            "✨🎂 Chúc mừng sinh nhật! 🎂✨"
        ];

        let index = 0;

        const textElement = document.getElementById("text");

        function showMessage() {

            textElement.style.opacity = 0;

            setTimeout(() => {

                textElement.innerHTML = messages[index];

                textElement.style.opacity = 1;

                index = (index + 1) % messages.length;

            }, 1000);
        }

        showMessage();

        setInterval(showMessage, 4000);


        /* =========================
           TRÁI TIM
        ========================= */

        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "heart";

            const hearts = ["❤️", "💖", "💕", "💗", "💓", "💘"];

            heart.innerHTML =
                hearts[Math.floor(Math.random() * hearts.length)];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.setProperty(
                "--move",
                (Math.random() * 200 - 100) + "px"
            );

            heart.style.animationDuration =
                (5 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 10000);
        }

        setInterval(createHeart, 500);


        /* =========================
           SAO
        ========================= */

        function createStar() {

            const star = document.createElement("div");

            star.className = "star";

            star.innerHTML = "✦";

            star.style.left =
                Math.random() * 100 + "vw";

            star.style.top =
                Math.random() * 100 + "vh";

            star.style.animationDelay =
                Math.random() * 2 + "s";

            document.body.appendChild(star);
        }

        for (let i = 0; i < 70; i++) {
            createStar();
        }


        /* =========================
           PHÁO HOA
        ========================= */

        function createFirework() {

            const firework = document.createElement("div");

            firework.className = "firework";

            firework.style.left =
                (20 + Math.random() * 60) + "vw";

            firework.style.top =
                (10 + Math.random() * 50) + "vh";

            document.body.appendChild(firework);

            setTimeout(() => {
                firework.remove();
            }, 1200);
        }

        setInterval(createFirework, 1800);


        /* =========================
           BÓNG BAY
        ========================= */

        function createBalloon() {

            const balloon = document.createElement("div");

            balloon.className = "balloon";

            const balloons = [
                "🎈",
                "🎈",
                "🎈",
                "🎈"
            ];

            balloon.innerHTML =
                balloons[Math.floor(Math.random() * balloons.length)];

            balloon.style.left =
                Math.random() * 100 + "vw";

            balloon.style.animationDuration =
                (8 + Math.random() * 6) + "s";

            document.body.appendChild(balloon);

            setTimeout(() => {
                balloon.remove();
            }, 15000);
        }

        setInterval(createBalloon, 1800);

    </script>

</body>
</html>
